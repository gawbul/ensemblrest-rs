[package]
name = "ensemblrest"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Steve Moss <gawbul@gmail.com>"]
license = "MIT"
description = "A Rust client library for the Ensembl REST API"
repository = "https://github.com/gawbul/ensemblrest-rs"
documentation = "https://docs.rs/ensemblrest"
readme = "README.md"
keywords = ["ensembl", "bioinformatics", "genomics", "rest", "api"]
categories = ["api-bindings", "science"]

# Repo tooling and internal build documents are not useful to consumers of the
# library and would otherwise be published to crates.io and docs.rs.
exclude = [
    "docs/**",
    ".github/**",
    "AGENTS.md",
    "CLAUDE.md",
    "Makefile",
]

[dependencies]
ureq = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
