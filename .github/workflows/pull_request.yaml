name: Pull Request

on:
  pull_request:
    paths: ['**.rs', 'Cargo.toml', 'Cargo.lock', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['**.rs', 'Cargo.toml', 'Cargo.lock', '.github/workflows/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-24
        with:
          toolchain: '1.98'
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify the dependency budget
        run: |
          direct=$(cargo tree --depth 1 --prefix none | tail -n +2 | grep -c . || true)
          echo "direct dependencies: $direct"
          test "$direct" -eq 3 || { echo "expected exactly 3 direct dependencies"; exit 1; }

      - name: Test
        run: cargo test --all-targets

      - name: Doctests
        run: cargo test --doc

      - name: Build the example
        run: cargo build --examples

  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-24
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Live smoke tests
        env:
          ENSEMBL_LIVE_TESTS: '1'
        run: cargo test --test live -- --ignored
